name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  actions: write # 发布后显式触发 pages,刷新站点上的版本号

env:
  TAGS: with_quic,with_utls,with_clash_api,with_gvisor

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-ci-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45 # 真机验收若把跑机的网络弄断,别让作业挂到 6 小时
    env:
      TEST_SUB_URL: ${{ secrets.TEST_SUB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        shell: bash
        run: |
          go vet -tags "$TAGS" ./internal/... ./cmd/godusevpn-svc ./cmd/godusevpn-cli
          go vet -tags desktop,production ./cmd/godusevpn
          go test -count=1 -tags "$TAGS" ./...

      - name: Race
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          # 数据竞争在服务里是致命的:并发读写 map 是不可恢复的 fatal error,进程直接退出、几秒后被服务管理器拉起,
          # 真机验收里只表现为"控制管道突然连不上、过一会儿又好了"。-race 要 cgo(gcc);没有 gcc 就让这一步失败,别悄悄跳过。
          gcc --version | head -1
          # internal/core 不在这里:它的测试要真的起 sing-box,而 sing-box 1.14.0 自己有一处竞争(route/network.go:
          # Start 末尾写 r.started、网卡变化的后台协程读它)。那是个布尔标志,最坏是启动那一刻少 / 多重置一次连接,
          # 不会崩;但 -race 一律判失败。core 包自己的代码只在上面不带 -race 的 Test 那一步测。
          go test -race -count=1 -tags "$TAGS" $(go list -tags "$TAGS" ./internal/... | grep -v "/internal/core$")

      - name: Embed icon and version resources
        shell: bash
        run: |
          set -e
          go install github.com/tc-hib/go-winres@v0.3.3
          V="${{ needs.version.outputs.version }}"; NV="${V%%-*}"
          for n in godusevpn godusevpn-svc godusevpn-cli; do
            go-winres make --in winres/$n.json --out cmd/$n/rsrc --arch amd64,arm64 --file-version "$NV" --product-version "$V"
          done

      - name: Build binaries (amd64, arm64)
        shell: bash
        run: |
          set -e
          V="${{ needs.version.outputs.version }}"
          LD="-s -w -X github.com/Maoyangui/godusevpn/internal/buildinfo.Version=$V"
          for arch in amd64 arm64; do
            mkdir -p dist/$arch
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -tags "$TAGS" -trimpath -ldflags "$LD" -o dist/$arch/godusevpn-svc.exe ./cmd/godusevpn-svc
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "$LD" -o dist/$arch/godusevpn-cli.exe ./cmd/godusevpn-cli
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -tags desktop,production -trimpath -ldflags "$LD -H windowsgui" -o dist/$arch/godusevpn.exe ./cmd/godusevpn
          done
          ls -la dist/amd64 dist/arm64

      # 在这台真 Windows 上把服务装起来、建隧道、切到严格全局模式:WFP 闸拦不拦得住绑物理网卡的直连、
      # 提供者有没有绑服务名、停服务后闸还在不在、网卡 IPv6 的停用 / 还原脚本(含备份里有已消失网卡)能不能跑通。
      # 这些只有真机能验;没配 TEST_SUB_URL 机密时只编译不验收(外部 PR 拿不到机密)。
      # 另取一份绑了服务名的旧版(0.7.1)裸二进制:验"从旧版原地升级不断开 —— 闸换到新一代提供者,升级前后都拦着直连"。
      - name: 取旧版(0.7.1)做原地升级验收
        if: env.TEST_SUB_URL != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.1 -R ${{ github.repository }} -p "godusevpn-0.7.1-windows-x64-bin.zip" -D legacy
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive legacy\godusevpn-0.7.1-windows-x64-bin.zip -DestinationPath legacy\bin -Force
          Get-ChildItem legacy\bin

      - name: 真机验收(WFP 闸、停服务闸仍在、网卡 IPv6 还原、从旧版原地升级)
        if: env.TEST_SUB_URL != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # 先把退出码设成一个哨兵值:脚本要是根本没跑起来(语法错、参数绑定失败),Continue 下调用处只打一行红字,
          # 接着 exit 的就是这个哨兵而不是 0 —— 以前 exit $LASTEXITCODE 在这种情况下是 0,作业照样是绿的、tag 照样发布。
          $global:LASTEXITCODE = 97
          & .\deploy\vps-test.ps1 -Sub $env:TEST_SUB_URL -Bin (Resolve-Path dist\amd64).Path -LegacyBin (Resolve-Path legacy\bin).Path
          exit $LASTEXITCODE

      # 严格全局下反复"停服务 → 起服务 → 自动重连":v0.7.5 的真机验收里两次抓到服务刚连上就崩(DLL 里写空指针的
      # 访问违例),普通验收一次运行只重启一两回,难得撞上。这里连着重启,撞上就失败并打出崩溃现场(见脚本头注释)。
      - name: 重启压力(严格全局下反复重启,服务不许崩)
        if: env.TEST_SUB_URL != ''
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Continue"
          $global:LASTEXITCODE = 97 # 哨兵:脚本没跑起来时别当成 0
          & .\deploy\restart-stress.ps1 -Sub $env:TEST_SUB_URL -Bin (Resolve-Path dist\amd64).Path -Rounds 100
          exit $LASTEXITCODE

      - name: Fetch WebView2 installers
        shell: bash
        run: |
          mkdir -p installer/deps
          curl -fsSL -o installer/deps/MicrosoftEdgeWebview2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          curl -fsSL -o installer/deps/MicrosoftEdgeWebView2RuntimeInstallerX64.exe "https://go.microsoft.com/fwlink/?linkid=2124701"
          ls -la installer/deps
          curl -fsSL -o installer/ChineseSimplified.isl "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"

      - name: Build installers (Inno Setup)
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=$v /DArch=amd64 installer\godusevpn.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $iscc /DAppVersion=$v /DArch=amd64 /DOfflineWebView2=1 installer\godusevpn.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $iscc /DAppVersion=$v /DArch=arm64 installer\godusevpn.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\installer

      # 用**真正的安装包**从 0.7.1 原地升级(不断开),后台持续绑物理网卡打直连,断言一次都没通。
      # 另带一段测量(如实打印,见 deploy/installer-upgrade-test.ps1):绑服务名的提供者停服务后还拦不拦。
      - name: 真机验收(用安装包从 0.7.1 原地升级,全程直连一次都不能通)
        if: env.TEST_SUB_URL != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          gh release download v0.7.1 -R ${{ github.repository }} -p "godusevpn-0.7.1-windows-x64-setup.exe" -D legacy-setup
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $new = @(Get-ChildItem dist\installer -Filter "*-windows-x64-setup.exe")
          if ($new.Count -ne 1) { Write-Host "找不到唯一的新版 x64 安装包"; Get-ChildItem dist\installer; exit 1 }
          # 先把退出码设成一个哨兵值:脚本要是根本没跑起来(语法错、参数绑定失败),Continue 下调用处只打一行红字,
          # 接着 exit 的就是这个哨兵而不是 0 —— 以前 exit $LASTEXITCODE 在这种情况下是 0,作业照样是绿的、tag 照样发布。
          $global:LASTEXITCODE = 97
          & .\deploy\installer-upgrade-test.ps1 -Sub $env:TEST_SUB_URL -OldSetup (Resolve-Path legacy-setup\godusevpn-0.7.1-windows-x64-setup.exe).Path -NewSetup $new[0].FullName -NewBin (Resolve-Path dist\amd64).Path
          exit $LASTEXITCODE

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\installer\*.exe out\
          # 裸二进制(服务 / 托盘 / 命令行三个 exe)打成 zip,给手工替换与排障用
          Compress-Archive -Path dist\amd64\*.exe -DestinationPath "out\godusevpn-$v-windows-x64-bin.zip"
          Compress-Archive -Path dist\arm64\*.exe -DestinationPath "out\godusevpn-$v-windows-arm64-bin.zip"
          # 0.5 及以前的客户端按老名字 godusevpn-<版本>-x64-setup.exe 找安装包,再留一份别名让它们能升上来;过几个版本可以去掉
          Copy-Item "out\godusevpn-$v-windows-x64-setup.exe" "out\godusevpn-$v-x64-setup.exe"
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.version.outputs.version }}
          path: out/*

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_SUB_URL: ${{ secrets.TEST_SUB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          # cmd/godusevpn 是 Wails 窗口程序,Linux 上没有它要的 GTK/WebKit 头文件,不在这里编
          go vet -tags "$TAGS" ./internal/... ./cmd/godusevpn-daemon ./cmd/godusevpn-cli
          go test -count=1 -tags "$TAGS" ./internal/... ./cmd/godusevpn-daemon ./cmd/godusevpn-cli

      - name: Race
        env:
          CGO_ENABLED: "1"
        run: |
          # 数据竞争在服务里是致命的:并发读写 map 是不可恢复的 fatal error,进程直接退出、几秒后被服务管理器拉起,
          # 真机验收里只表现为"控制管道突然连不上、过一会儿又好了"。-race 要 cgo(gcc);没有 gcc 就让这一步失败,别悄悄跳过。
          gcc --version | head -1
          # internal/core 不在这里:它的测试要真的起 sing-box,而 sing-box 1.14.0 自己有一处竞争(route/network.go:
          # Start 末尾写 r.started、网卡变化的后台协程读它)。那是个布尔标志,最坏是启动那一刻少 / 多重置一次连接,
          # 不会崩;但 -race 一律判失败。core 包自己的代码只在上面不带 -race 的 Test 那一步测。
          go test -race -count=1 -tags "$TAGS" $(go list -tags "$TAGS" ./internal/... | grep -v "/internal/core$")

      - name: Build (amd64, arm64, armv7, mipsle, mips)
        run: |
          set -e
          V="${{ needs.version.outputs.version }}"
          LD="-s -w -X github.com/Maoyangui/godusevpn/internal/buildinfo.Version=$V"
          mkdir -p out
          build() { # 名字 GOARCH [额外环境]
            name=$1; arch=$2; shift 2
            mkdir -p dist/linux/$name
            env CGO_ENABLED=0 GOOS=linux GOARCH=$arch "$@" go build -tags "$TAGS" -trimpath -ldflags "$LD" -o dist/linux/$name/godusevpn ./cmd/godusevpn-daemon
            cp deploy/install.sh dist/linux/$name/ 2>/dev/null || true
            tar -C dist/linux/$name -czf out/godusevpn-$V-linux-$name.tar.gz .
            sh deploy/mkipk.sh "$V" "$name" dist/linux/$name/godusevpn out/godusevpn-$V-openwrt-$name.ipk
          }
          build amd64 amd64
          build arm64 arm64
          build armv7 arm GOARM=7
          build mipsle mipsle GOMIPS=softfloat
          build mips mips GOMIPS=softfloat
          ls -la out

      # 在这台真 Linux 上把服务装起来、建隧道、切到严格全局模式:nftables 闸拦不拦得住普通用户绑物理网卡的直连、
      # 切回规则模式表清不清得空、网卡 IPv6 的还原(含备份里有已消失网卡)能不能跑通。没配机密时只编译不验收。
      - name: 真机验收(建隧道、nftables 闸、网卡 IPv6 还原)
        if: env.TEST_SUB_URL != ''
        run: |
          set -e
          sudo apt-get install -y -qq nftables >/dev/null 2>&1 || true
          sudo install -m755 dist/linux/amd64/godusevpn /usr/local/bin/godusevpn
          sudo sh deploy/linux-test.sh "$TEST_SUB_URL" /usr/local/bin/godusevpn

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ needs.version.outputs.version }}
          path: out/*

  macos:
    needs: version
    runs-on: macos-latest # 苹果芯片的跑机;既用来编译,也用来真机验收
    env:
      TEST_SUB_URL: ${{ secrets.TEST_SUB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go vet -tags "$TAGS" ./internal/... ./cmd/godusevpn-daemon ./cmd/godusevpn-cli
          go vet -tags desktop,production ./cmd/godusevpn
          go test -count=1 -tags "$TAGS" ./internal/... ./cmd/godusevpn-daemon ./cmd/godusevpn-cli

      # 一个包里两样东西:godusevpn 是守护进程 + 命令行(装到 /usr/local/bin),
      # godusevpn.app 是图形界面(装到 /Applications)。install.sh 一起装好并注册 launchd。
      - name: Build (arm64, amd64)
        run: |
          set -e
          V="${{ needs.version.outputs.version }}"
          LD="-s -w -X github.com/Maoyangui/godusevpn/internal/buildinfo.Version=$V"
          mkdir -p out
          # 图标:从项目图标生成 .icns(苹果只认这一种)
          rm -rf /tmp/icon.iconset && mkdir -p /tmp/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s cmd/godusevpn/build/appicon-macos.png --out /tmp/icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) cmd/godusevpn/build/appicon-macos.png --out /tmp/icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns /tmp/icon.iconset -o /tmp/icon.icns
          for arch in arm64 amd64; do
            mkdir -p dist/macos/$arch
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -tags "$TAGS" -trimpath -ldflags "$LD" -o dist/macos/$arch/godusevpn ./cmd/godusevpn-daemon
            # 图形界面要连 WebKit,必须开 CGO;跑机是苹果芯片,编英特尔版时只换目标架构。
            # 不要再压低 -mmacosx-version-min:Go 1.27 生成的目标文件本身就是 macOS 13 起步,
            # 压低了 UniformTypeIdentifiers 里的 UTType 会链接不到(实测 ld: symbol(s) not found)。
            APP="dist/macos/$arch/godusevpn.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            # Wails 的文件对话框用了 UTType,但它自己没声明 UniformTypeIdentifiers 这个框架,
            # 这台跑机的 SDK 又不会顺带带进来,所以在这儿补上(不补就 ld: _OBJC_CLASS_$_UTType not found)。
            if [ "$arch" = amd64 ]; then export CC="clang -arch x86_64"; fi
            CGO_ENABLED=1 CGO_LDFLAGS="-framework UniformTypeIdentifiers" GOOS=darwin GOARCH=$arch \
              go build -tags desktop,production -trimpath -ldflags "$LD" -o "$APP/Contents/MacOS/godusevpn" ./cmd/godusevpn
            unset CC
            sed "s/__VERSION__/$V/g" cmd/godusevpn/build/darwin/Info.plist > "$APP/Contents/Info.plist"
            cp /tmp/icon.icns "$APP/Contents/Resources/icon.icns"
            cp deploy/macos-install.sh dist/macos/$arch/install.sh
            chmod +x dist/macos/$arch/install.sh
            tar -C dist/macos/$arch -czf out/godusevpn-$V-macos-$arch.tar.gz .
          done
          file dist/macos/*/godusevpn dist/macos/*/godusevpn.app/Contents/MacOS/godusevpn
          ls -la out

      # 在这台真 Mac 上把服务装起来、真的建隧道跑流量:流量是否按规则进隧道、IPv6 是否真被拦住、各页面接口是否正常。
      # 没配 TEST_SUB_URL 机密时只编译不验收(外部 PR 拿不到机密)。
      - name: 真机验收(建隧道、跑流量、查 IPv6 泄漏)
        if: env.TEST_SUB_URL != ''
        run: |
          set -e
          A=arm64; [ "$(uname -m)" = "x86_64" ] && A=amd64
          sudo install -m755 "dist/macos/$A/godusevpn" /usr/local/bin/godusevpn
          sudo sh deploy/macos-test.sh "$TEST_SUB_URL" /usr/local/bin/godusevpn

      # 图形界面没法在没人看的跑机上点,但至少要证明它能起来:装进 /Applications、打开、
      # 看进程还在不在、有没有留下崩溃报告。起不来的话这一步就红,不会把坏包发出去。
      - name: 图形界面冒烟(能不能打开)
        run: |
          set -e
          A=arm64; [ "$(uname -m)" = "x86_64" ] && A=amd64
          sudo cp -R "dist/macos/$A/godusevpn.app" /Applications/godusevpn.app
          /usr/bin/plutil -lint /Applications/godusevpn.app/Contents/Info.plist
          open -a /Applications/godusevpn.app || { echo "打不开"; exit 1; }
          sleep 12
          if ! pgrep -f "/Applications/godusevpn.app/Contents/MacOS/godusevpn" >/dev/null; then
            echo "进程没活下来"
            ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
            for f in ~/Library/Logs/DiagnosticReports/godusevpn*; do [ -f "$f" ] && head -40 "$f"; done
            exit 1
          fi
          echo "图形界面起来了,进程 $(pgrep -f '/Applications/godusevpn.app/Contents/MacOS/godusevpn' | tr '\n' ' ')"
          osascript -e 'quit app "godusevpn"' 2>/dev/null || pkill -f "/Applications/godusevpn.app/Contents/MacOS/godusevpn" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ needs.version.outputs.version }}
          path: out/*

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: gomobile bind (AAR:arm64、armv7、x86_64)
        run: |
          set -e
          V="${{ needs.version.outputs.version }}"
          LD="-s -w -X github.com/Maoyangui/godusevpn/internal/buildinfo.Version=$V"
          go vet -tags "$TAGS" ./mobile
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          gomobile init
          mkdir -p android/app/libs
          # sum.golang.org 时不时抽风("stream error … INTERNAL_ERROR"),gomobile 里的 go mod tidy 会因此失败:重试三次
          for i in 1 2 3; do
            if gomobile bind -target android/arm64,android/arm,android/amd64 -androidapi 26 -javapkg com.maoyangui.godusevpn \
              -tags "$TAGS" -ldflags "$LD" -trimpath -o android/app/libs/godusevpn.aar ./mobile; then break; fi
            [ "$i" = 3 ] && exit 1
            echo "gomobile bind 第 $i 次失败,30 秒后重试"; sleep 30
          done
          ls -la android/app/libs

      - name: Signing key (仓库机密里的自建密钥)
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/keystore.jks

      - name: Gradle (按 ABI 分包 + 通用包)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          V="${{ needs.version.outputs.version }}"
          mkdir -p out
          # 没有签名密钥就只编 debug 包。正式包退回 debug 签名等于让已装用户再也升不了级(签名不一致装不上),
          # 所以 build.gradle.kts 里那道守门会直接让 assembleRelease 失败 —— fork 过来的 PR 拿不到机密,
          # 这里必须自己绕开,不然每个外部 PR 的 android 作业都是红的。
          if [ -f android/keystore.jks ]; then
            gradle -p android --no-daemon -q assembleRelease "-PappVersion=$V" "-PsplitAbi=true"
            for pair in arm64-v8a:arm64 armeabi-v7a:armv7 x86_64:x86_64 universal:universal; do
              abi=${pair%%:*}; name=${pair##*:}
              cp android/app/build/outputs/apk/release/app-$abi-release.apk out/godusevpn-$V-android-$name.apk
            done
          else
            echo "没有签名密钥(fork 的 PR 拿不到机密):只编 debug 包验证能不能编过,不产出可发布的安装包"
            gradle -p android --no-daemon -q assembleDebug "-PappVersion=$V"
            cp android/app/build/outputs/apk/debug/app-debug.apk out/godusevpn-$V-android-debug-UNSIGNED-DO-NOT-SHIP.apk
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.version.outputs.version }}
          path: out/*

  release:
    needs: [version, windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      # 签名器使用仓库 go.mod 中已锁定的 x/crypto/ssh;没有源码 checkout
      # 时,在 out/ 里运行 go run 会落到模块外并无法解析依赖。
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Checksums
        run: |
          mkdir -p out
          find art -type f -exec cp {} out/ \;
          # 没有签名密钥时 android 作业出的是 debug 包(见那边的注释)。那种包对已装用户等于
          # "再也升不了级",绝不能混进发布。名字里带着记号,这里当场拦下。
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && ls out/ | grep -q "DO-NOT-SHIP"; then
            echo "::error::产物里有未签名的 debug 包,不能发布:"; ls out/ | grep "DO-NOT-SHIP"; exit 1
          fi
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # 发布信任根的私钥只在打 tag 的发布构建里解出来。m29 的写法是"非 tag 且没密钥才跳过",
      # 于是推 master、同仓库分支的 PR 也会把私钥写进跑机的 /tmp 并签一份 —— 平白多出一片暴露面,
      # 而那些构建根本不会发布,签了也没人用。
      - name: Sign checksums
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY" || { echo "::error::缺少 RELEASE_SIGNING_KEY,拒绝发布"; exit 1; }
          printf '%s\n' "$RELEASE_SIGNING_KEY" > /tmp/godusevpn-release.key
          cat > sign-sums.go <<'EOF'
          package main

          import (
            "crypto/rand"
            "encoding/base64"
            "fmt"
            "os"
            "golang.org/x/crypto/ssh"
          )

          func main() {
            key, err := os.ReadFile(os.Args[1]); if err != nil { panic(err) }
            signer, err := ssh.ParsePrivateKey(key); if err != nil { panic(err) }
            msg, err := os.ReadFile(os.Args[2]); if err != nil { panic(err) }
            sig, err := signer.Sign(rand.Reader, msg); if err != nil { panic(err) }
            if sig.Format != "ssh-ed25519" || len(sig.Blob) != 64 { panic(fmt.Sprintf("unexpected signature format %q", sig.Format)) }
            fmt.Print(base64.StdEncoding.EncodeToString(sig.Blob))
          }
          EOF
          cd out && go run ../sign-sums.go /tmp/godusevpn-release.key SHA256SUMS > SHA256SUMS.sig
          cd ..
          rm -f /tmp/godusevpn-release.key sign-sums.go
          test "$(wc -c < out/SHA256SUMS.sig)" -gt 80
          cat out/SHA256SUMS.sig
      - uses: actions/upload-artifact@v4
        with:
          name: godusevpn-${{ needs.version.outputs.version }}
          path: out/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "佛跳墙 v${{ needs.version.outputs.version }}"
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          files: out/*

      # 用 GITHUB_TOKEN 建出来的 Release 不会再触发别的工作流(GitHub 防循环),
      # 所以 pages.yml 里那个 release: published 永远等不到。发完显式点一下,
      # 站点上的版本号才不会慢一拍。触发失败不影响这次发布。
      - name: Refresh site
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # release 作业没 checkout,gh 在空目录里找不到仓库上下文,必须显式 -R
        run: gh workflow run pages.yml --ref master -R "$GITHUB_REPOSITORY" || echo "触发 pages 失败(不影响发布)"
