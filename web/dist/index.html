<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佛跳墙</title>
<link rel="stylesheet" href="style.css">
<script>
/* 白屏自曝。老设备(比如中国版小米电视,WebView 常年停在 Chrome 66)遇到页面里的新语法,会整份脚本解析失败、
   什么都不显示,用户和我们都看不到任何线索。这段负责把原因直接打在屏幕上,截个图就能定位。
   注意:这里只能用 ES5 写法。 */
(function () {
  // flex 布局里的 gap 要 Chrome 84。老内核(国行电视盒子的 WebView 常年停在 Chrome 66 一线)不认,
  // 一行里的元素会全部贴死。这里实测一次,不支持才给 <html> 挂 nogap,样式里有一整套 margin 兜底。
  // 必须实测而不是查版本号:CSS 里没有可靠的特性查询能区分 flex gap(grid 的 gap 老内核是支持的)。
  try {
    var probe = document.createElement('div');
    probe.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
    probe.appendChild(document.createElement('div'));
    probe.appendChild(document.createElement('div'));
    var host = document.body || document.documentElement;
    host.appendChild(probe);
    var gapWorks = probe.scrollHeight === 1;
    host.removeChild(probe);
    if (!gapWorks) document.documentElement.className += ' nogap';
  } catch (e) { }

  var errs = [];
  function show() {
    try {
      var el = document.getElementById('boot-error');
      if (!el) {
        el = document.createElement('div');
        el.id = 'boot-error';
        el.setAttribute('style', 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101418;color:#e7eaf0;font:18px/1.7 monospace;padding:24px;overflow:auto;white-space:pre-wrap;word-break:break-all');
        (document.body || document.documentElement).appendChild(el);
      }
      el.textContent = '\u4f5b\u8df3\u5899 \u754c\u9762\u6ca1\u80fd\u542f\u52a8 / UI failed to start\n\n' + errs.join('\n\n') + '\n\n' + navigator.userAgent;
    } catch (e) { }
  }
  window.onerror = function (msg, src, line, col) {
    errs.push(String(msg) + '\n  ' + String(src || '') + ':' + line + ':' + col);
    show();
    return false;
  };
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && t !== window && (t.src || t.href)) { errs.push('\u8d44\u6e90\u52a0\u8f7d\u5931\u8d25 ' + (t.src || t.href)); show(); }
  }, true);
  setTimeout(function () {
    if (!window.__godBooted) {
      errs.push('\u754c\u9762 10 \u79d2\u6ca1\u8d77\u6765\uff1a\u811a\u672c\u53ef\u80fd\u88ab\u8fd9\u53f0\u8bbe\u5907\u7684\u6d4f\u89c8\u5668\u5185\u6838\u62d2\u7edd\u4e86');
      show();
    }
  }, 10000);
})();
</script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" title="菜单"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="icon-btn" id="back-btn" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="topbar-title" id="topbar-title">佛跳墙</div>
    <div class="win">
      <button class="icon-btn" id="min-btn" title="最小化"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button class="icon-btn" id="close-btn" title="收到托盘"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>
  <main class="stage" id="stage"></main>

  <div class="backdrop" id="drawer-backdrop"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-brand">
      <svg viewBox="-16 -50 400 400" width="34" height="34" aria-hidden="true"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="70" y1="70" x2="310" y2="270"><stop offset="0" stop-color="#6a44f2"/><stop offset=".55" stop-color="#2f8bff"/><stop offset="1" stop-color="#18e3e8"/></linearGradient></defs><g fill="none" stroke="url(#g)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M86 248V84l146 124v52"/><path d="M332 78l-88 96"/></g><path fill="url(#g)" d="M118 192l52 30-52 30z"/></svg>
      <div><b>佛跳墙</b><div class="muted small" id="drawer-ver"></div><div class="upd-hint" id="drawer-upd" hidden></div></div>
    </div>
    <div class="drawer-state" id="drawer-state" hidden></div>
    <div class="drawer-items" id="drawer-items"></div>
    <div class="drawer-foot"><span class="dot" id="svc-dot"></span><span id="svc-text" class="small muted"></span><span class="grow"></span><button class="icon-btn xs muted" id="theme-btn"></button></div>
  </nav>

  <div class="backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet"><div class="sheet-grip"></div><div class="sheet-head" id="sheet-head"></div><div class="sheet-body" id="sheet-body"></div></section>

  <div class="toast" id="toast"></div>
  <div class="login" id="login" hidden>
    <div class="login-card">
      <svg viewBox="-16 -50 400 400" width="56" height="56" aria-hidden="true"><g fill="none" stroke="url(#g)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M86 248V84l146 124v52"/><path d="M332 78l-88 96"/></g><path fill="url(#g)" d="M118 192l52 30-52 30z"/></svg>
      <h1>佛跳墙</h1><p id="login-title"></p>
      <input type="password" id="login-pw" autocomplete="current-password">
      <button class="btn primary block" id="login-go"></button>
      <div id="login-err" class="small" style="color:var(--danger);min-height:18px"></div>
    </div>
  </div>
</div>
<script src="api.js"></script>
<script src="i18n.js"></script>
<script src="flags.js"></script>
<script src="app.js"></script>
</body>
</html>
