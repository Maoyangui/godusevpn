<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佛跳墙</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" title="菜单"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="icon-btn" id="back-btn" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="topbar-title" id="topbar-title">佛跳墙</div>
    <div class="win">
      <button class="icon-btn" id="min-btn" title="最小化"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button class="icon-btn" id="close-btn" title="收到托盘"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>
  <main class="stage" id="stage"></main>

  <div class="backdrop" id="drawer-backdrop"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-brand">
      <svg viewBox="-16 -50 400 400" width="34" height="34" aria-hidden="true"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="70" y1="70" x2="310" y2="270"><stop offset="0" stop-color="#6a44f2"/><stop offset=".55" stop-color="#2f8bff"/><stop offset="1" stop-color="#18e3e8"/></linearGradient></defs><g fill="none" stroke="url(#g)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M86 248V84l146 124v52"/><path d="M332 78l-88 96"/></g><path fill="url(#g)" d="M118 192l52 30-52 30z"/></svg>
      <div><b>佛跳墙</b><div class="muted small" id="drawer-ver"></div><div class="upd-hint" id="drawer-upd" hidden></div></div>
    </div>
    <div class="drawer-items" id="drawer-items"></div>
    <div class="drawer-foot"><span class="dot" id="svc-dot"></span><span id="svc-text" class="small muted"></span></div>
  </nav>

  <div class="backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet"><div class="sheet-grip"></div><div class="sheet-head" id="sheet-head"></div><div class="sheet-body" id="sheet-body"></div></section>

  <div class="toast" id="toast"></div>
  <div class="login" id="login" hidden>
    <div class="login-card">
      <svg viewBox="-16 -50 400 400" width="56" height="56" aria-hidden="true"><g fill="none" stroke="url(#g)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M86 248V84l146 124v52"/><path d="M332 78l-88 96"/></g><path fill="url(#g)" d="M118 192l52 30-52 30z"/></svg>
      <h1>佛跳墙</h1><p id="login-title"></p>
      <input type="password" id="login-pw" autocomplete="current-password">
      <button class="btn primary block" id="login-go"></button>
      <div id="login-err" class="small" style="color:var(--danger);min-height:18px"></div>
    </div>
  </div>
</div>
<script src="api.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
